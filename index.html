<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GFL — Global Farming League</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root { --red:#e5160d; --ink:#1b1718; --soft:#f7f5f4; }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { margin:0; color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#fff; }
      .grid-bg { background-color:#fffdfc; background-image:linear-gradient(rgba(229,22,13,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(229,22,13,.045) 1px,transparent 1px),radial-gradient(circle at 50% 0%,rgba(229,22,13,.055),transparent 30%); background-size:32px 32px,32px 32px,100% 100%; }
      .brand-font { font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; letter-spacing:.05em; }
      .display { font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; letter-spacing:.045em; }
      .red-line { width:56px; height:4px; background:var(--red); border-radius:100%; margin:14px auto 0; box-shadow:0 5px 14px rgba(229,22,13,.36); }
      .card { background:rgba(255,255,255,.94); border:1px solid #eee7e5; border-radius:20px; box-shadow:0 12px 34px rgba(30,20,20,.07); }
      .card:hover { box-shadow:0 20px 45px rgba(30,20,20,.11); transform:translateY(-2px); transition:.25s ease; }
      .btn-red { background:linear-gradient(135deg,#f1281f,#b60c08 70%); color:#fff; box-shadow:0 12px 25px rgba(197,16,10,.30); transition:transform .2s ease,box-shadow .2s ease; }
      .btn-red:hover { transform:translateY(-2px); box-shadow:0 17px 29px rgba(197,16,10,.38); }
      .hero { min-height:660px; background:#fff; isolation:isolate; }
      .hero-art { position:absolute; inset:0; overflow:hidden; z-index:0; }
      .hero-art img { width:100%; height:100%; object-fit:cover; object-position:center; animation:heroArtReveal .9s cubic-bezier(.2,.8,.2,1) both, heroPan 15s ease-in-out .9s infinite alternate; }
      .hero:after { content:''; position:absolute; z-index:1; inset:auto 0 0; height:150px; background:linear-gradient(transparent,#fffdfc); pointer-events:none; }
      .hero .max-w-6xl { z-index:2; }
      .hero-copy { animation:heroIn .8s cubic-bezier(.2,.8,.2,1) both; }
      .hero-copy p, .hero-copy h1, .hero-copy > div { animation:heroLineIn .65s cubic-bezier(.2,.8,.2,1) both; }
      .hero-copy h1 { animation-delay:.12s; }
      .hero-copy > div { animation-delay:.24s; }
      .hero-copy .btn-red { animation:buttonGlow 2.8s ease-in-out 1.1s infinite; }
      .red-line { animation:pulseLine 2.8s ease-in-out infinite; }
      main .card, section .card { animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both; }
      main .card:nth-child(2), section .card:nth-child(2) { animation-delay:.08s; }
      @keyframes heroIn { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }
      @keyframes heroLineIn { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }
      @keyframes heroArtReveal { from { opacity:0; transform:scale(1.04); } to { opacity:1; transform:scale(1); } }
      @keyframes heroPan { from { transform:scale(1); } to { transform:scale(1.045); } }
      @keyframes buttonGlow { 0%,100% { box-shadow:0 12px 25px rgba(197,16,10,.30); } 50% { box-shadow:0 16px 32px rgba(229,22,13,.53); } }
      @keyframes cardIn { from { opacity:0; transform:translateY(16px) scale(.985); } to { opacity:1; transform:translateY(0) scale(1); } }
      @keyframes pulseLine { 0%,100% { transform:scaleX(.8); opacity:.65; } 50% { transform:scaleX(1.18); opacity:1; } }
      @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; } }
      @media(max-width:700px){ .hero { min-height:650px; } .hero-art { opacity:.58; } .hero-art img { object-position:60% center; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const {useState} = React;
      const entryUrl = 'https://band.us/@gflentry';
      const globalChatUrl = 'https://link.clashofclans.com/?action=OpenGlobalChat&chatId=Pfb0ca7b465354a2896bdf798cd9d72be';
      const heroImages = ['assets/gfl-hero-random-1.png','assets/gfl-hero-random-2.png','assets/gfl-hero-random-3.png','assets/gfl-hero-random-4.png','assets/gfl-hero-random-5.png','assets/gfl-hero-random-6.png','assets/gfl-hero-random-7.png'];
      const heroImage = heroImages[Math.floor(Math.random() * heroImages.length)];
      const pages = ['Home','Overview','How to Join','Battle Style','Assistance','Base Layouts','Staff Login'];
      const SectionTitle = ({children,sub}) => <div className="text-center mb-10"><h2 className="display text-4xl md:text-5xl uppercase">{children}</h2><div className="red-line"/>{sub && <p className="mt-5 max-w-2xl mx-auto text-zinc-600">{sub}</p>}</div>;
      const Placeholder = ({title,body}) => <div className="card p-8 text-center border-dashed border-2"><p className="font-bold text-red-700">{title}</p><p className="mt-2 text-sm text-zinc-600">{body}</p></div>;
      function Header({page,setPage}) {
        const [open,setOpen]=useState(false);
        const go=(p)=>{setPage(p);setOpen(false);window.scrollTo(0,0)};
        return <header className="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-stone-200 shadow-sm"><div className="max-w-6xl mx-auto h-20 px-5 flex items-center justify-between"><button aria-label="GFL Home" onClick={()=>go('Home')} className="flex items-center gap-2"><img src="assets/gfl-logo.png" className="h-12 w-12 object-contain"/><span className="brand-font text-3xl text-red-600">GFL</span></button><nav className="hidden md:flex gap-1" aria-label="Main navigation">{pages.map(p=><button key={p} onClick={()=>go(p)} className={'px-3 py-2 text-sm font-semibold rounded-lg '+(page===p?'text-red-700 bg-red-50':'hover:bg-stone-100')}>{p}</button>)}</nav><button onClick={()=>setOpen(!open)} className="md:hidden p-2 rounded-lg border border-stone-200" aria-expanded={open} aria-label="Open menu">☰</button></div>{open&&<nav className="md:hidden px-5 pb-4 flex flex-col gap-1">{pages.map(p=><button key={p} onClick={()=>go(p)} className="text-left px-4 py-3 rounded-lg hover:bg-red-50">{p}</button>)}</nav>}</header>
      }
      const Stats=()=> <section className="max-w-5xl mx-auto px-5 -mt-12 relative z-10"><div className="card grid grid-cols-3 divide-x divide-stone-200"><div className="p-5 text-center"><div className="text-2xl text-red-600">♧</div><b className="display text-2xl text-red-600">135+</b><div className="text-[10px] font-bold tracking-wide">ACTIVE CLANS</div></div><div className="p-5 text-center"><div className="text-2xl text-red-600">♢</div><b className="display text-2xl text-red-600">2019</b><div className="text-[10px] font-bold tracking-wide">FOUNDED</div></div><div className="p-5 text-center"><div className="text-2xl text-red-600">⚔</div><b className="display text-2xl text-red-600">1200+</b><div className="text-[10px] font-bold tracking-wide">WARS COMPLETED</div></div></div></section>;
      const Home=({setPage})=><><section className="hero relative overflow-hidden"><div className="hero-art" aria-hidden="true"><img src={heroImage} alt=""/></div><div className="max-w-6xl mx-auto px-5 pt-24 pb-32 relative"><div className="max-w-xl hero-copy"><p className="font-bold tracking-[.25em] text-red-700 text-sm">COOPERATIVE CLAN WAR COMMUNITY</p><h1 className="display text-6xl md:text-8xl leading-[.86] mt-5"><span className="text-zinc-950">GLOBAL</span><br/><span className="text-red-600">FARMING</span><br/><span className="text-zinc-950">LEAGUE</span></h1><p className="mt-8 max-w-lg text-lg md:text-xl leading-relaxed">Unlock the ultimate Clash of Clans progression strategy. Join 135+ active clans participating in synchronized farming wars and enjoy stress-free growth with guaranteed massive loot payouts every 48 hours.</p><div className="mt-8 flex flex-wrap gap-3"><button onClick={()=>setPage('How to Join')} className="btn-red px-7 py-4 rounded-xl font-bold">Join GFL Today</button><button onClick={()=>setPage('Overview')} className="bg-white px-7 py-4 rounded-xl font-bold">Learn More</button></div></div></div></section><Stats/><section className="grid-bg py-24"><div className="max-w-5xl mx-auto px-5"><SectionTitle>About Us</SectionTitle><div className="card p-7 md:p-11 text-lg leading-8 text-zinc-700">Founded in 2019, the <b>Global Farming League (GFL)</b> is a cooperative community of <b>135+ clans</b> dedicated to stress-free progression. We coordinate synchronized matchmaking using the <b>Western Sahara location</b> so our clans consistently match against each other. Inside our wars, members use standardized, easy-to-clear <span className="text-red-700 underline font-bold">base layouts</span> to ensure both sides achieve maximum star counts. This system guarantees that players earn massive war loot while clans rapidly level up their XP with minimal effort. Beyond matchmaking, our dedicated staff team on BAND provides expert war support, mismatch analysis, and blacklist protection. GFL is the ultimate home for clans looking to maximize their rewards without the pressure of competitive gaming.</div></div></section><ChatSection/></>;
      const ChatSection=()=> <section className="grid-bg py-24"><div className="max-w-3xl mx-auto px-5"><SectionTitle>Join the Global Chat of GFL</SectionTitle><div className="card p-6 md:p-9 text-center"><img src="assets/gfl-global-chat-qr.jpeg" alt="Official GFL Global Chat QR code" className="w-64 max-w-full mx-auto rounded-xl border border-stone-200"/><p className="mt-5 text-sm text-zinc-600">Scan the official QR code or use the button below to join the GFL Global Chat.</p></div><div className="text-center mt-8"><a href={globalChatUrl} className="inline-block btn-red px-8 py-4 rounded-xl font-bold">Join GFL Global Chat</a></div></div></section>;
      const Overview=()=> <main className="grid-bg py-20"><div className="max-w-4xl mx-auto px-5"><SectionTitle sub="A cooperative alliance for faster, smarter clan progression.">Overview</SectionTitle><article className="card p-7 md:p-12 space-y-6 text-lg leading-8 text-zinc-700"><p>The Global Farming League is a premium cooperative alliance built for Clash of Clans leaders who want to level up their clans faster, smarter, and without the burnout of competitive warring.</p><p>Currently home to over 135 active clans, GFL is a massive community that works together to completely eliminate the stress of regular clan wars. By synchronizing our war search times and using standardized free-loot base designs, our clans consistently match against each other to guarantee massive resource payouts and maximum Clan XP for everyone involved.</p><p>In GFL, you do not need active heroes, expensive war armies, or complex attack strategies. We have replaced the pressure of fighting to the death with a highly organized, win-win ecosystem.</p><p>Whether your clan takes the designated win or the designated loss for the round, every single member walks away with millions in loot and significant clan progression. Less stress, faster upgrades, and a worldwide community to support you.</p><p>Curious about exactly how we coordinate these matches fairly? Head over to our Battle Style section to see a complete breakdown of our unique point system, sync timeline, and war mechanics!</p></article></div></main>;
      const Join=()=> <main className="grid-bg py-20"><div className="max-w-5xl mx-auto px-5"><SectionTitle>How to Join</SectionTitle><div className="card p-7 md:p-10 text-lg leading-8 text-zinc-700"><p>Ready to become part of the Global Farming League? Joining our community is simple. Whether you are fully prepared to apply or just want to see how things work, your journey starts here.</p><div className="grid md:grid-cols-2 gap-5 my-9"><div className="border border-red-100 rounded-2xl p-6"><h3 className="font-bold text-xl text-red-700">🚪 GFL Entry BAND</h3><p className="mt-3">If your clan has 50 members and is ready to join, this is your first stop. Join our Entry Lounge to speak directly with our onboarding team and submit your official application.</p><a href={entryUrl} target="_blank" rel="noreferrer" className="inline-block btn-red px-5 py-3 rounded-xl font-bold mt-5">Join GFL Entry BAND</a></div><div className="border border-stone-200 rounded-2xl p-6"><h3 className="font-bold text-xl">🌍 GFL Community BAND</h3><p className="mt-3">Waiting for approval or just want to hang out? Jump into our massive Community Hub to chat with existing GFL leaders and get a feel for how our league operates.</p><button className="mt-5 px-5 py-3 rounded-xl font-bold border border-stone-200">Official link coming soon</button></div></div><h3 className="display text-3xl uppercase">Joining Requirements</h3><div className="grid md:grid-cols-2 gap-4 mt-5">{[['Clan Size','Your clan must have 50 active members to participate in our 50v50 synced wars.'],['Leadership','You must be the verified Leader or an authorized Co-Leader of an active clan in good standing.'],['War Commitment','Your clan must have dedicated representatives/co-leaders who are reliably available to hit the "Start War" button at our exact synchronized times.'],['Clan Weight','Your clan must maintain a healthy overall war weight to ensure balanced matchmaking within our league system.']].map(([t,b])=><div className="bg-stone-50 rounded-xl p-5" key={t}><b>{t}</b><p className="text-base mt-1">{b}</p></div>)}</div><h3 className="display text-3xl uppercase mt-10">Transition Process</h3><div className="space-y-5 mt-5">{[['Step 1: Update Clan Settings','Set your clan\'s location to "Western Sahara" and update your clan description to state "Future GFL" so our admins know you are preparing to join.'],['Step 2: Build your clan','Gather 50 active players. If you are short on members, you can easily recruit players looking for farm wars on platforms like BAND, Discord, or Reddit.'],['Step 3: Base Setup','Ensure that all 50 players have copied and activated an officially approved GFL farming base layout before you submit your application.']].map(([t,b])=><div key={t}><b className="text-red-700">{t}</b><p>{b}</p></div>)}</div><div className="mt-10 p-6 rounded-2xl bg-red-50 border border-red-100"><b className="text-red-800">Important Guidelines & Security</b><p className="mt-2"><b>Security Warning:</b> Official GFL Staff will NEVER ask you for a Co-Leader or Leader promotion inside your clan to "verify" or "audit" you. Protect your clan and never give leadership roles to unverified strangers.</p></div></div></div></main>;
      const Battle=()=> <main className="grid-bg py-20"><div className="max-w-4xl mx-auto px-5"><SectionTitle>Battle Style</SectionTitle><article className="card p-7 md:p-12 text-lg leading-8 text-zinc-700"><p>GFL completely replaces the stress of competitive warring with a highly coordinated, mutually beneficial system. Our battle style is designed to maximize resources and Clan XP for both sides with absolute efficiency.</p>{[['1. Coordinated Matchmaking','Instead of searching randomly, all GFL clans initiate their war searches at the exact same second using synchronized timers. Because our clans maintain similar war compositions, the game\'s matchmaking algorithm pairs us together with incredible consistency.'],['2. The Free-Loot Base Setup','During the war, every clan activates an approved GFL farming base layout. These layouts place all major defenses (like Inferno Towers and Eagle Artilleries) in one corner, and the Town Hall and resource storages completely exposed in another. This allows even lower-level troops to easily secure high-percentage 2 or 3-star wins.'],['3. Fair Win/Loss Distribution','We don\'t fight to the death; we cooperate. Before the war starts, our official GFL Point System determines the winner based on recent performance to ensure absolute fairness.'],['4. Zero Stress, Maximum Progression','There are no complex attack strategies, mirror-matching stress, or expensive army compositions required. Members use cheap farming armies to secure their stars in minutes, allowing your clan to pull in millions of resources every single week while keeping the gameplay relaxed and fun.']].map(([t,b])=><section className="mt-8" key={t}><h3 className="font-bold text-xl text-red-700">{t}</h3><p>{b}</p></section>)}<div className="mt-8 bg-stone-50 p-6 rounded-2xl"><h3 className="font-bold">Points Distribution</h3><p>Win War: +1 Point<br/>Lose War: -1 Point<br/>Mismatch: 0 Points</p><h3 className="font-bold mt-4">Winner Determination</h3><p>The clan with the lower point total wins the round. If points are equal, the system checks the last war result, then previous wars until a winner is determined.<br/>Example: Clan X (-2 points) vs Clan Y (-1 point) → Clan X wins (lower points).</p><h3 className="font-bold mt-4">War Execution</h3><p><b>The Winning Clan:</b> Scores maximum stars (usually 150+ in a 50vs50 war) to secure the 100% war bonus.</p><p><b>The Losing Clan:</b> Easily scores enough stars (100⭐) to unlock the maximum possible losing loot bonus and massive Clan XP.</p></div></article></div></main>;
      const Bases=()=> <main className="grid-bg py-20"><div className="max-w-4xl mx-auto px-5"><SectionTitle sub="Approved layouts will be provided here.">Base Layouts</SectionTitle><Placeholder title="Official GFL farming base layouts coming soon" body="Add approved layout images or links here when they are available. This page intentionally does not display invented layouts."/></div></main>;
      const Assistance=()=> <section className="grid-bg py-20"><div className="max-w-5xl mx-auto px-5"><SectionTitle>Assistance</SectionTitle><div className="grid md:grid-cols-2 gap-5">{[['Emergency War Fillers','Emergencies happen. If a member suddenly leaves your clan right before the sync time, our dedicated staff and clan reps will quickly provide emergency players to full hoir clan. This ensures your clan hits the exact 50 member requirement and can start the war search perfectly on schedule.'],['Dispute Resolution','If your opponent fails to activate a farming layout or leaves illegal war bases active, our Dispute Department steps in immediately. We guarantee fair judgment, punishing the rule-breaking clan with a forced war loss and awarding your clan the official win.'],['Matchmaking Assistance','If your clan does not match against a GFL clan during a sync, our expert staff will step in to provide full, dedicated support. We will help you analyze and adjust your war weights and roster to ensure your clan matches perfectly within the alliance every time.'],['Base Audit System','If you are unsure whether all 50 members in your clan have the correct farming layouts set up, you can request an official base audit. Our specialized Audit Team will visit your clan, thoroughly inspect every war base, and provide a detailed report pointing out exactly which bases have errors so you can fix them before the war.'],['Blacklist Support','If your clan accidentally matches against a blacklisted clan, our league stands fully behind you. We provide the necessary support and backup to help you defeat them. As a reward for fighting these rogue clans and defending the community, GFL compensates your clan with guaranteed "War Win" credits in our official league point system.']].map(([t,b])=><div className="card p-6" key={t}><h3 className="font-bold text-xl text-red-700">{t}</h3><p className="mt-3 leading-7 text-zinc-700">{b}</p></div>)}</div></div></section>;
      const Staff=()=> <main className="grid-bg py-20 min-h-[70vh]"><div className="max-w-md mx-auto px-5"><SectionTitle>Staff Login</SectionTitle><div className="card p-8"><p className="text-zinc-600">Staff access is a frontend-only prototype until secure authentication is added.</p><label className="block mt-6 text-sm font-bold">Email</label><input disabled placeholder="Secure login coming soon" className="mt-2 w-full p-3 rounded-lg border bg-stone-50"/><label className="block mt-4 text-sm font-bold">Password</label><input disabled type="password" placeholder="Secure login coming soon" className="mt-2 w-full p-3 rounded-lg border bg-stone-50"/><button disabled className="mt-6 w-full py-3 rounded-xl bg-stone-200 font-bold text-stone-500">Prototype only</button></div></div></main>;
      function App(){const [page,setPage]=useState('Home');let content=page==='Home'?<Home setPage={setPage}/>:page==='Overview'?<Overview/>:page==='How to Join'?<Join/>:page==='Battle Style'?<Battle/>:page==='Assistance'?<Assistance/>:page==='Base Layouts'?<Bases/>:<Staff/>;return <><Header page={page} setPage={setPage}/>{content}<footer className="bg-stone-950 text-white py-10"><div className="max-w-6xl mx-auto px-5 flex flex-col md:flex-row justify-between gap-5"><div className="flex items-center gap-2"><img src="assets/gfl-logo.png" className="h-12 w-12 object-contain"/><span className="brand-font text-2xl text-red-500">GFL</span></div><p className="text-sm text-stone-400">Global Farming League · Cooperative Clash of Clans farming wars</p></div></footer></>}
      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
  </body>
</html>
